name: Audit exact 8054 bootloader USB script and unlock hints (read-only)
on:
  push:
    paths:
      - "tools/audit_8054_usb_upgrade_script_hints.py"
      - ".github/workflows/audit-8054-usb-upgrade-script.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check isolated read-only MBOOT inspector
        run: |
          set -euo pipefail
          python3 -m py_compile tools/audit_8054_usb_upgrade_script_hints.py
          echo 'Python syntax PASS'
      - name: Download unchanged exact-8054 owner backup archive
        run: |
          set -euo pipefail
          gh release download FlixTone_8054_Backup \
            --repo MAX-TAC/FlixTone_8054_Backup \
            --pattern FlixTone_8054_Backup.zip --dir /tmp
          test "$(stat -c %s /tmp/FlixTone_8054_Backup.zip)" -eq 2011878129
          echo 'Original archive length PASS'
      - name: Inspect MBOOT USB file names and script signatures without writing to hardware
        run: |
          set -euo pipefail
          python3 tools/audit_8054_usb_upgrade_script_hints.py /tmp/FlixTone_8054_Backup.zip
