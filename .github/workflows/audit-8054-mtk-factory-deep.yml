name: Exact 8054 MediaTek Factory full UI and backend static audit
on:
  push:
    paths:
      - "tools/audit_8054_mtk_factory_deep.py"
      - ".github/workflows/audit-8054-mtk-factory-deep.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  full-static:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check Python syntax and install read-only readers
        run: |
          set -euo pipefail
          python3 -m py_compile tools/audit_8054_mtk_factory_deep.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq erofs-utils aapt unzip default-jre
      - name: Fetch unchanged owner exact 8054 firmware
        run: |
          set -euo pipefail
          gh release download FlixTone_8054_Backup --repo MAX-TAC/FlixTone_8054_Backup \
            --pattern FlixTone_8054_Backup.zip --dir /tmp
          test "$(stat -c %s /tmp/FlixTone_8054_Backup.zip)" -eq 2011878129
          sha256sum /tmp/FlixTone_8054_Backup.zip | grep -i '^4f53f2224c98b4c832a19a591b9dd7f925bde28528b5674a09732c0f0e41d362 '
          python3 tools/inspect_8054_draft_safely.py /tmp/FlixTone_8054_Backup.zip >/tmp/8054-backup-verified.log
          python3 tools/deep_audit_8054_stock.py >/tmp/8054-erofs-verified.log
          test -s /tmp/flix8054_erofs/system_ext_a_tree/app/Factory/Factory.apk
          sha256sum /tmp/flix8054_erofs/system_ext_a_tree/app/Factory/Factory.apk
          echo "Exact 8054 STOCK Factory.apk extracted; projector untouched"
      - name: Decompile original factory APK with pinned JADX 1.5.6
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          JAVA_OPTS=-Xmx5g /tmp/jadx/bin/jadx -r -j 4 -d /tmp/factory8054-jadx \
            /tmp/flix8054_erofs/system_ext_a_tree/app/Factory/Factory.apk > /tmp/jadx8054.log 2>&1 || {
              echo "JADX partial warning: inspect java source availability"
              tail -n 20 /tmp/jadx8054.log
            }
          test -s /tmp/factory8054-jadx/sources/mediatek/tvsetting/factory/ui/designmenu/DesignMenuActivity.java
          echo "Factory Java source extracted"
      - name: Decode only APK resources (never execute factory code)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o /tmp/apktool.jar
          mkdir -p /tmp/factory8054-res
          java -jar /tmp/apktool.jar d -f -s \
            /tmp/flix8054_erofs/system_ext_a_tree/app/Factory/Factory.apk \
            -o /tmp/factory8054-res >/tmp/factory8054-apktool.log 2>&1 || {
              echo "Resource decode partial warning"
              tail -n 15 /tmp/factory8054-apktool.log
            }
      - name: Generate full static code and resource inventory
        run: |
          set -euo pipefail
          python3 tools/audit_8054_mtk_factory_deep.py \
            --jadx /tmp/factory8054-jadx --resources /tmp/factory8054-res/res \
            --out research/8054/mtk_factory_deep
          test -s research/8054/mtk_factory_deep/FACTORY_DEEP_AUDIT_8054.md
          test -s research/8054/mtk_factory_deep/FOCUS_SCREEN_METHODS_8054.json
          echo "All generated reports are static/read-only, never raw partition contents"
      - name: Commit research output to isolated branch
        run: |
          set -euo pipefail
          git config user.name "8054 Static Research Bot"
          git config user.email "8054-research-bot@users.noreply.github.com"
          git add research/8054/mtk_factory_deep/
          if ! git diff --cached --quiet; then
            git commit -m "Record complete static Factory UI menu, callbacks and Dolby Vision evidence from exact 8054 stock"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Static report unchanged"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: exact-8054-mtk-factory-deep-static
          path: research/8054/mtk_factory_deep/
          if-no-files-found: error
