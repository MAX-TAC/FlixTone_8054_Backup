name: Analyze D11 8054 draft backup metadata (read-only; no private files)
on:
  push:
    paths:
      - 'tools/inspect_8054_draft_safely.py'
      - '.github/workflows/inspect-8054-draft.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download same-repository draft ZIP (never publish file)
        run: |
          set -euo pipefail
          gh release download FlixTone_8054_Backup \
            --repo MAX-TAC/FlixTone_8054_Backup \
            --pattern FlixTone_8054_Backup.zip --dir /tmp
          test "$(stat -c %s /tmp/FlixTone_8054_Backup.zip)" -eq 2011878129
          sha256sum /tmp/FlixTone_8054_Backup.zip | grep -i '^4f53f2224c98b4c832a19a591b9dd7f925bde28528b5674a09732c0f0e41d362 '
      - name: Inspect ONLY mboot, uenv and super metadata
        run: |
          set -euo pipefail
          python3 tools/inspect_8054_draft_safely.py /tmp/FlixTone_8054_Backup.zip
